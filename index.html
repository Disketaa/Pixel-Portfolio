<body>

<header class="site-header">
  <div class="site-header__brand">
    <img class="site-logo" src="icon.png" alt="Disketaa" width="32" height="32">
    <h1 class="site-title">Disketaa's Art</h1>
  </div>
  <p class="site-header__meta" id="work-count">loading works&hellip;</p>
</header>

<main>
  <section class="grid" id="grid" aria-live="polite"></section>

  <div class="empty-state" id="empty-state" hidden>
    <p class="empty-state__title">Nothing on the wall yet.</p>
    <p class="empty-state__body">Drop a PNG or GIF into <code>/works</code> and push to <code>main</code>. The layout builds itself.</p>
  </div>
</main>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__backdrop" data-close></div>
  <div class="lightbox__panel" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
    <button class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
    <div class="lightbox__frame">
      <img class="lightbox__image" id="lightbox-image" alt="">
    </div>
    <div class="lightbox__meta">
      <p class="lightbox__data" id="lightbox-data"></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
