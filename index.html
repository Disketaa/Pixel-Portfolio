<!doctype html>
<html lang="en" data-theme="snowy-blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disketaa</title>
    <meta
      name="description"
      content="A pixel art portfolio. Drop PNG/GIF into assets/works/ and define grid layouts with layout.json."
    />
    <link rel="icon" href="assets/icon.png?" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="site-header" id="top">
      <div class="header-inner">
        <div class="brand-group">
          <div class="brand-row">
            <span class="site-subtitle" id="site-subtitle"></span>
          </div>
          <div class="header-tags-row">
            <button
              class="icon-btn header-tags__arrow"
              id="header-tags-arrow"
              type="button"
              aria-label="Back to top"
            >
              <img src="assets/arrow.svg" alt="" width="11" height="11" />
            </button>
            <nav
              class="header-tags"
              id="header-tags"
              aria-label="Subsections"
            ></nav>
            <span class="header-tags__spacer" aria-hidden="true"></span>
            <span class="header-brand">
              <span class="header-brand__name"
                >Disketaa<span class="header-brand__suffix">'s Art</span></span
              >
              <img
                class="header-brand__logo"
                src="assets/icon.png"
                alt=""
                width="32"
                height="32"
              />
            </span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="grid" id="grid" aria-live="polite"></section>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox__backdrop"></div>
      <div class="lightbox__panel" role="dialog" aria-modal="true">
        <button
          class="icon-btn lightbox__close"
          id="lightbox-close"
          aria-label="Close"
        >
          <img src="assets/close.svg" alt="" width="11" height="11" />
        </button>
        <button
          class="icon-btn lightbox__arrow lightbox__arrow--prev"
          id="lightbox-prev"
          type="button"
          aria-label="Previous image"
        >
          <img src="assets/arrow.svg" alt="" width="11" height="11" />
        </button>
        <button
          class="icon-btn lightbox__arrow lightbox__arrow--next"
          id="lightbox-next"
          type="button"
          aria-label="Next image"
        >
          <img src="assets/arrow.svg" alt="" width="11" height="11" />
        </button>
        <div class="card__tooltip" id="lightbox-title"></div>
        <div class="lightbox__frame bg-checker">
          <canvas class="lightbox__image" id="lightbox-image"></canvas>
          <img class="lightbox__image" id="lightbox-image-gif" alt="" hidden />
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <span class="site-footer__version" id="site-version"></span>
    </footer>

    <script type="module" src="scripts/helpers/main.js"></script>
  </body>
</html>
