<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disketaa</title>
    <meta
      name="description"
      content="A pixel art portfolio. Drop PNG/GIF into works/ and define grid layouts with layout.txt."
    />
    <link rel="icon" href="assets/icon.png?" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__brand">
        <img
          class="site-logo"
          src="assets/icon.png"
          alt="Disketaa"
          width="32"
          height="32"
        />
        <h1 class="site-title">Disketaa's Art</h1>
      </div>
      <p class="site-header__meta" id="work-count">loading works&hellip;</p>
    </header>

    <main>
      <section class="grid" id="grid" aria-live="polite"></section>

      <div class="empty-state" id="empty-state" hidden>
        <p class="empty-state__title">Nothing on the wall yet.</p>
        <p class="empty-state__body">
          Drop PNG/GIF into <code>works/</code>, add <code>layout.txt</code> per
          folder to define the grid, then push to <code>main</code>.
        </p>
      </div>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox__backdrop" data-close></div>
      <div class="lightbox__panel" role="dialog" aria-modal="true">
        <button class="lightbox__close" id="lightbox-close" aria-label="Close">
          <img src="assets/close.svg" alt="" width="11" height="11" />
        </button>
        <div class="lightbox__frame">
          <canvas class="lightbox__image" id="lightbox-image"></canvas>
          <img class="lightbox__image" id="lightbox-image-gif" alt="" hidden />
        </div>
        <div class="lightbox__meta">
          <p class="lightbox__data" id="lightbox-data"></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
