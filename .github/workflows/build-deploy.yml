name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'assets/art/**'
      - 'scripts/**'
      - 'index.html'
      - 'styles/**'
      - 'package.json'
      - '.github/workflows/build-deploy.yml'
      - 'manifest.json'
      - 'assets/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate manifest
        run: npm run generate-manifest

      - name: Stage site
        run: |
          mkdir -p _site/art _site/assets _site/styles _site/scripts/helpers
          echo "{\"version\":$GITHUB_RUN_NUMBER}" > _site/version.json
          cp index.html manifest.json _site/
          cp -r styles/. _site/styles/
          cp scripts/helpers/*.js _site/scripts/helpers/
          cp -r assets/. _site/assets/
          cp -r assets/art/. _site/art/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
